---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-COMPONENT

resources:
  - ../../base
  - configmaps.yaml
  - middlewares.yaml
  - ingress.yaml
  - pod-monitor.yaml

labels:
    - pairs:
            platform: sweetrpg
            app: COMPONENT
            component: web

generatorOptions:
  disableNameSuffixHash: true
